name: Release

# Publishes the built app as crewly-app-dist.tar.gz, which is what the
# server's `npm run fetch:app` downloads when no sibling checkout is present.
#
# The tarball has a single top-level directory because fetch-app.mjs unpacks it
# with --strip-components=1.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  create:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }

      - name: Install
        run: npm ci

      - name: Verify release source and version
        id: release_context
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -eu
          tag="${REQUESTED_TAG#release/}"
          test "$tag" = "v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_EVENT" = create ]; then
            test "$REQUESTED_TAG" = "release/$tag"
            git merge-base --is-ancestor HEAD origin/main
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # Vendored protocol and SDK must match their owner before anything ships.
      - name: Check vendored code, build and test
        run: |
          git clone --no-checkout https://github.com/crewly-space/server.git ../server
          git -C ../server checkout "$(node -p 'require("./release.json").serverRef')"
          npm --prefix ../server ci
          npm --prefix ../server run build
          npm run vendor:check
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:release
          npm run test:ui

      - name: Package
        run: |
          set -eu
          test -f dist/index.html
          mkdir -p release
          tar -czf release/crewly-app-dist.tar.gz dist
          cd release
          sha256sum crewly-app-dist.tar.gz > checksums.txt
          cat checksums.txt

      # fetch-app.mjs strips the leading directory, so prove the archive
      # actually unpacks to a servable app rather than assuming the shape.
      - name: Verify the archive unpacks to a servable app
        run: |
          set -eu
          mkdir -p /tmp/unpack
          tar -xzf release/crewly-app-dist.tar.gz -C /tmp/unpack --strip-components=1
          test -f /tmp/unpack/index.html
          echo "archive unpacks correctly"

      # A release branch uses the same checks as a tag, but creates the tag
      # only after the distributable exists. The repository token cannot
      # recursively trigger another tag workflow.
      - name: Ensure the checked release tag exists
        env:
          TAG: ${{ steps.release_context.outputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -eu
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            test "$RELEASE_EVENT" = create
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_context.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crewly App $TAG" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag \
            release/crewly-app-dist.tar.gz \
            release/checksums.txt

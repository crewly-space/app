name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      # Vendored copies must match the owning repo; clone it as a sibling.
      - name: Clone and build crewly-server
        # Needed twice over: vendor:check diffs the vendored protocol/sdk against
        # it, and test/p0-ui.test.tsx renders the UI against a real server. For
        # coordinated cross-repo changes, prefer a server branch with the same
        # name as the app branch; otherwise validate against server/main.
        run: |
          SERVER_REPOSITORY=https://github.com/crewly-space/server.git
          SERVER_REF=$(node -p 'require("./release.json").serverRef')
          git clone --no-checkout "$SERVER_REPOSITORY" ../server
          git -C ../server checkout --detach "$SERVER_REF"
          npm --prefix ../server ci
          npm --prefix ../server run build
      - run: npm ci
      - run: npm run vendor:check
      - run: npm run build
      - run: npm test
      - name: Verify the production app in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:release

name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      # Vendored copies must match the owning repo; clone it as a sibling.
      - name: Clone and build crewly-server
        # Needed twice over: vendor:check diffs the vendored protocol/sdk against
        # it, and test/p0-ui.test.tsx renders the UI against a real server.
        run: |
          git clone --depth 1 https://github.com/crewly-space/server.git ../server
          npm --prefix ../server ci
          npm --prefix ../server run build
      - run: npm ci
      - run: npm run vendor:check
      - run: npm run build
      - run: npm test
